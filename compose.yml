services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.webserver
      # no_cache: true
      args:
        - VITE_APP_URL=${VITE_APP_URL}
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_ORIGIN=${VITE_API_ORIGIN}
        - VITE_ENVIRONMENT=${VITE_ENVIRONMENT}
        - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
        - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
        - VITE_FEGA_COUNTRY_NAME=${VITE_FEGA_COUNTRY_NAME}
        - VITE_FEGA_COUNTRY_ADJECTIVE=${VITE_FEGA_COUNTRY_ADJECTIVE}
        - GITHUB_URL=https://github.com/rliechti/fhdportal-app
        - API_GITHUB_URL=https://api.github.com/repos/rliechti/fhdportal-app
    restart: unless-stopped
    ports:
      - "5173:80"
      - "5174:443"
    env_file:
      - .env
    depends_on:
      - api
    environment:
      # ServerName of the virtual hosts (conf/fhd-portal.conf)
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./logs:/logs
      # the certificate of the HTTPS port (5174): replace it with one for PUBLIC_HOST, see scripts/make-certs.sh
      - ./certs/server.crt:/usr/local/apache2/conf/server.crt:ro
      - ./certs/server.key:/usr/local/apache2/conf/server.key:ro
    networks:
      - web-db-net
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - GITHUB_URL=https://github.com/rliechti/fhdportal-api
        - API_GITHUB_URL=https://api.github.com/repos/rliechti/fhdportal-api
        - FEGA_SCHEMA_DIR=${FEGA_SCHEMA_DIR:-/var/www/fhd-portal/htdocs/api/data/schemas}
    ports:
      # the ports other than 5173, 5174 and 8443 (the portal and Keycloak) are for this machine only: INTERNAL_BIND in .env
      - "${INTERNAL_BIND:-127.0.0.1}:8082:80"
    env_file:
      - .env
    volumes:
      - ./logs:/usr/local/log
      - .:/api
      - ./sda-inbox:/var/www/fhd-portal/sda
      # single source of configuration: the app (and its cron jobs) read this file
      - ./.env:/var/www/fhd-portal/htdocs/api/.env:ro
    depends_on:
      - db
    networks:
      - web-db-net
  db:
    build:
      context: .
      dockerfile: Dockerfile.database
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:5433:5432"
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    healthcheck:
      test: "exit 0"
    volumes:
      - ./fhd-db-data:/var/lib/postgresql/data:rw
    networks:
      - web-db-net
  keycloak:
    image: quay.io/keycloak/keycloak
    command: start-dev  --https-certificate-file=/certs/cert.pem --https-certificate-key-file=/certs/key.pem --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: X9c5AL2TssiDLHk
      KC_DB_USERNAME: fhd-user
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KEYCLOAK_IMPORT: /tmp/fhdportal-realm.json
      # The address of Keycloak as the BROWSER sees it. It is the issuer of every token, whatever address a request used
      # (a token requested at keycloak:8080 inside the network carries it too). The back-channel endpoints stay dynamic.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # the address of the portal, for the redirect URIs of the client fhdportal-sp (${PORTAL_URL} in the realm file)
      PORTAL_URL: ${PORTAL_URL:-http://localhost:5173}
    volumes:
      - ./init/fhdportal-realm.json:/opt/keycloak/data/import/fhdportal-realm.json
      - ./certs/cert.pem:/certs/cert.pem 
      - ./certs/cert-key.pem:/certs/key.pem
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:8080:8080"
      - 8443:8443
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-db-net
  mailhog:
      container_name: mailhog
      image: mailhog/mailhog
      ports:
        - "${INTERNAL_BIND:-127.0.0.1}:1025:1025"
        - "${INTERNAL_BIND:-127.0.0.1}:8025:8025"
      networks:
        - web-db-net
  dac-api:
    build:
        context: .
        dockerfile: Dockerfile.dacapi
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:3000:3000"
    networks:
      - web-db-net
    restart: unless-stopped
volumes:
  fhd-db-data:
    name: fhd-db-data
networks:
  web-db-net:
    driver: bridge